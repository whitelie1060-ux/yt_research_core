[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-research-core"
version = "0.1.0"
description = "Generic YouTube research engine (trending/search fetch, channel-stats batching, scoring, JSON IO) shared across research pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_research_core"]
